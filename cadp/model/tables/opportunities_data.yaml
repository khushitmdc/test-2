tables:
  - name: opportunities_data
    title: opportunities_data
    sql: {{ load_sql('opportunities_data') }}
    description: Semantic view for opportunities_data.
    public: true
    dimensions:
      - name: id
        type: string
        column: id
        description: The unique identifier for the opportunity.
        public: true
        primary_key: true
      - name: agency
        type: string
        column: agency
        description: The government agency associated with the opportunity.
        public: true
      - name: opportunity_name
        type: string
        column: opportunity_name
        description: The name of the business opportunity.
        public: true
      - name: leidos_tcv_amount_in_dollar
        type: number
        column: leidos_tcv_amount_in_dollar
        description: Leidos Total Contract Value in dollars.
        public: true
      - name: rfi_release_date
        type: time
        column: rfi_release_date
        description: Request for Information release date.
        public: true
    measures:
      - name: total_opportunities
        type: count
        sql: "{TABLE.id}"
        description: Total number of opportunities.
        public: true
      - name: total_tcv_amount
        type: sum
        sql: "{TABLE.leidos_tcv_amount_in_dollar}"
        description: Total summed contract value amount in dollars.
        public: true
    joins:
      - name: practice_area_workshare_data
        relationship: one_to_many
        sql: "{TABLE}.id = {practice_area_workshare_data.id}"
      - name: ops_to_activities_data
        relationship: one_to_many
        sql: "{TABLE}.id = {ops_to_activities_data.id}"
